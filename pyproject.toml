[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roofline-lint"
version = "0.1.0"
description = "Zero-dependency LLM deployment feasibility + roofline analyzer: run-worthiness, bandwidth-vs-compute bottleneck, batch scaling; refuses unanswerable capacity questions instead of printing fake tok/s"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aidless" }]
keywords = ["llm", "roofline", "vram", "inference", "capacity-planning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/aidless/roofline-lint"
Issues = "https://github.com/aidless/roofline-lint/issues"

[project.scripts]
roofline-lint = "roofline_lint:main"

[tool.setuptools]
py-modules = ["roofline_lint"]
